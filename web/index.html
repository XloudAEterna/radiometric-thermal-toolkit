<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>DJI Thermal Converter</title>

  <link href="css/bootstrap.min.css" rel="stylesheet">

  <script type="text/javascript" src="/eel.js"></script>

  <style>
    body {
      background-color: #1a1e24;
      min-height: 100vh;
      overflow-y: auto;
    }
    .form-control-dark {
      background-color: #161b22 !important;
      border: 1px solid #30363d !important;
      color: #ffffff !important;
    }
    .form-control-dark:focus {
      border-color: #1f4e87 !important;
      box-shadow: none !important;
    }
    #log {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      background-color: #0d1117 !important;
      color: #39d353 !important;
      border: 1px solid #21262d !important;
      resize: vertical;
      min-height: 200px;
      overflow-y: auto;
      display: block;
    }
    .range-hint {
      color: #6fb3e0;
      font-weight: 400;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">

  <div class="container" style="max-width: 850px; min-height: 100vh; padding-top: 20px; padding-bottom: 20px;">
    <div class="card bg-dark text-light shadow border-secondary h-100 p-4 d-flex flex-column gap-3" style="background-color: #21262d !important; border-color: #2d333b !important;">

      <header class="text-start">
        <h1 class="h4 text-white fw-bold mb-1">DJI Thermal Image Converter</h1>
        <p class="text-muted small mb-0">Convert R-JPEG metadata to Radiometric 32-bit Float TIFFs</p>
      </header>

      <div class="p-3 rounded-3 d-flex align-items-center justify-content-between gap-3 border border-secondary" style="background-color: #161b22;">
        <span id="folderLabel" class="text-secondary small text-truncate flex-grow-1">No folder selected</span>
        <span id="imageCount" class="badge bg-secondary text-white">Images: 0</span>
        <button id="selectFolderBtn" class="btn btn-sm btn-outline-light fw-bold text-nowrap">Select Folder</button>
      </div>

      <div class="row g-3">
        <div class="col-6">
          <label class="form-label small fw-bold text-secondary mb-1">Distance (m) <span class="range-hint">(1.0 – 25.0)</span></label>
          <input type="number" id="distance" class="form-control form-control-sm form-control-dark" value="0" min="1.0" max="25.0" step="0.1">
        </div>
        <div class="col-6">
          <label class="form-label small fw-bold text-secondary mb-1">Emissivity <span class="range-hint">(0.10 – 1.00)</span></label>
          <input type="number" id="emissivity" class="form-control form-control-sm form-control-dark" value="0" min="0.1" max="1.0" step="0.01">
        </div>
        <div class="col-6">
          <label class="form-label small fw-bold text-secondary mb-1">Reflected Temp (°C) <span class="range-hint">(-40.0 – 500.0)</span></label>
          <input type="number" id="reflected" class="form-control form-control-sm form-control-dark" value="0" min="-40.0" max="500.0" step="0.1">
        </div>
        <div class="col-6">
          <label class="form-label small fw-bold text-secondary mb-1">Ambient Temp (°C) <span class="range-hint">(-20.0 – 50.0)</span></label>
          <input type="number" id="ambient" class="form-control form-control-sm form-control-dark" value="0" min="-20.0" max="50.0" step="0.1">
        </div>
        <div class="col-12">
          <label class="form-label small fw-bold text-secondary mb-1">Humidity (%) <span class="range-hint">(20 – 100)</span></label>
          <input type="number" id="humidity" class="form-control form-control-sm form-control-dark" value="0" min="20" max="100" step="1">
        </div>
      </div>

      <div>
        <button id="convertBtn" class="btn w-100 fw-bold py-2 shadow-sm text-white" style="background-color: #1f4e87; border-color: #245d9e;">Start Conversion</button>
      </div>

      <div id="progressWrap" class="p-2 rounded-3 border border-secondary" style="display: none; background-color: #161b22;">
        <div class="d-flex justify-content-between small fw-bold text-white mb-1">
          <span>Processing Images</span>
          <span id="progressText" class="text-white">0 / 0</span>
        </div>
        <div class="progress bg-secondary" style="height: 8px;">
          <div id="progressFill" class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 0%;"></div>
        </div>
      </div>

      <div class="d-flex flex-column flex-grow-1 overflow-hidden">
        <label class="form-label small fw-bold text-secondary mb-1">Execution Logs</label>
        <div id="log" class="form-control flex-grow-1 overflow-auto p-3 text-start"></div>
      </div>

    </div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
